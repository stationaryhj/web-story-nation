<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 처리 중...</title>
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f9fafb;
      color: #111827;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 400px;
      border-radius: 0.5rem;
      background-color: white;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 1rem auto;
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      border-left-color: #7c3aed;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error {
      color: #b91c1c;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>로그인 처리 중</h2>
    <div class="spinner"></div>
    <p>잠시만 기다려주세요. 로그인 정보를 확인하고 있습니다.</p>
    <p class="error" id="error-message"></p>
  </div>

  <script>
    (function() {
      // URL에서 code와 state 파라미터 추출
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const state = urlParams.get('state');
      const error = urlParams.get('error');
      const errorDescription = urlParams.get('error_description');

      // 에러 메시지 표시 함수
      function showError(message) {
        document.getElementById('error-message').textContent = message;
        // 3초 후 창 닫기
        setTimeout(() => window.close(), 3000);
      }
      
      // 부모 창으로 데이터 전송
      function sendToParent() {
        try {
          // 오류 확인
          if (error) {
            const errorMsg = errorDescription || error;
            showError(`오류가 발생했습니다: ${errorMsg}`);
            
            window.opener.postMessage({
              error: errorMsg
            }, window.location.origin);
            
            return;
          }
          
          // code나 state가 없는 경우
          if (!code || !state) {
            showError('인증 정보가 올바르지 않습니다.');
            
            window.opener.postMessage({
              error: '인증 정보가 올바르지 않습니다.'
            }, window.location.origin);
            
            return;
          }
          
          // 부모 창에 데이터 전송
          window.opener.postMessage({
            code,
            state
          }, window.location.origin);
          
          // 성공 메시지 표시 후 창 닫기
          document.querySelector('.container').innerHTML = `
            <h2>로그인 성공!</h2>
            <p>잠시 후 이 창은 자동으로 닫힙니다.</p>
          `;
          
          // 1초 후 창 닫기
          setTimeout(() => window.close(), 1000);
        } catch (err) {
          showError('처리 중 오류가 발생했습니다: ' + err.message);
        }
      }
      
      // window.opener가 존재하는지 확인
      if (window.opener) {
        // DOM이 완전히 로드된 후 실행
        window.addEventListener('DOMContentLoaded', sendToParent);
      } else {
        // 부모 창이 없는 경우 - 직접 열린 경우
        showError('잘못된 접근입니다. 메인 페이지에서 로그인을 시도해주세요.');
      }
    })();
  </script>
</body>
</html>
